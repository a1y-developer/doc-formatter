basePath: /
definitions:
  handler.Response:
    properties:
      costTime:
        description: Time taken for the request.
        type: string
      data:
        description: Data payload.
      endTime:
        description: Request end time.
        type: string
      message:
        description: Descriptive message.
        type: string
      startTime:
        description: Request start time.
        type: string
      success:
        description: Indicates success status.
        type: boolean
      traceID:
        description: Trace identifier.
        type: string
    type: object
  request.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  request.SignupRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  response.Document:
    properties:
      created_at:
        type: integer
      file_name:
        type: string
      file_size:
        type: integer
      id:
        type: string
      updated_at:
        type: integer
      user_id:
        type: string
    type: object
  response.LoginResponse:
    properties:
      access_token:
        type: string
      expiry_unix:
        type: integer
    type: object
  response.SignUpResponse:
    properties:
      user_id:
        type: string
    type: object
info:
  contact: {}
  description: API for AI Doc Formatter
  title: AI Doc Formatter API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login user and return JWT token
      operationId: Login
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "429":
          description: Too Many Requests
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Login
      tags:
      - Auth
  /api/v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Create a new user account
      operationId: Signup
      parameters:
      - description: Signup payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.SignUpResponse'
              type: object
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "429":
          description: Too Many Requests
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Signup
      tags:
      - Auth
  /api/v1/storage/files:
    get:
      consumes:
      - application/json
      description: Retrieve a list of files uploaded by a specific user
      operationId: ListFilesByUserId
      parameters:
      - description: User ID (UUID)
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.Document'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "429":
          description: Too Many Requests
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: List files by user ID
      tags:
      - Storage
  /api/v1/storage/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload a file for a user
      operationId: UploadFile
      parameters:
      - description: User ID (UUID)
        in: formData
        name: user_id
        required: true
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/handler.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.Document'
              type: object
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "429":
          description: Too Many Requests
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Upload file
      tags:
      - Storage
swagger: "2.0"
